plugins {
    id 'io.kestra.gradle.repository-conventions' version '1.2.10'
    id "com.vanniktech.maven.publish" version "0.37.0"
    id "io.kestra.gradle.inject-bom-versions" version "1.2.10"
    id "io.kestra.gradle.plugin-doc-lint" version "1.2.10"
    id 'java-library'
    id "idea"
    id 'jacoco'
    id "com.gradleup.shadow" version "9.6.1"
    id 'signing'
    id 'net.researchgate.release' version '3.1.0'
}

def isBuildSnapshot = version.toString().endsWith("-SNAPSHOT")

configurations {
    bridgeRuntime {
        canBeConsumed = false
        canBeResolved = true
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    if (isBuildSnapshot) {
        maven { url = "https://central.sonatype.com/repository/maven-snapshots/" }
    }
}

final targetJavaVersion = JavaVersion.VERSION_25

java {
    sourceCompatibility = targetJavaVersion
    targetCompatibility = targetJavaVersion
}

group = "io.kestra.plugin"
description = 'Java and JBang execution tasks for Kestra workflows'

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.compilerArgs.add("-parameters")
}

dependencies {
    // Platform
    annotationProcessor enforcedPlatform("io.kestra:platform:$kestraVersion")
    implementation enforcedPlatform("io.kestra:platform:$kestraVersion")

    // lombok
    annotationProcessor "org.projectlombok:lombok"
    compileOnly "org.projectlombok:lombok"

    // kestra
    annotationProcessor "io.kestra:processor:$kestraVersion"
    compileOnly "io.kestra:core:$kestraVersion"
    compileOnly "io.kestra:script:$kestraVersion"
    compileOnly "com.fasterxml.jackson.core:jackson-databind"

    bridgeRuntime enforcedPlatform("io.kestra:platform:$kestraVersion")
    bridgeRuntime "com.fasterxml.jackson.core:jackson-databind"
}

def bridgeJar = tasks.register("bridgeJar", Jar) {
    dependsOn(tasks.named("compileJava"))
    archiveBaseName.set("kestra-java-bridge")
    archiveClassifier.set("bridge")
    destinationDirectory.set(layout.buildDirectory.dir("bridge"))
    from(layout.buildDirectory.dir("classes/java/main")) {
        include "io/kestra/plugin/java/bridge/**"
    }
    from({ configurations.bridgeRuntime.collect { dependency ->
        dependency.isDirectory() ? dependency : zipTree(dependency)
    } })
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude "META-INF/*.SF", "META-INF/*.DSA", "META-INF/*.RSA"
}

tasks.named("processResources", ProcessResources) {
    dependsOn(bridgeJar)
    from(bridgeJar.flatMap { it.archiveFile }) {
        rename { "kestra-java-bridge.jar" }
    }
}


/**********************************************************************************************************************\
 * Test
 **********************************************************************************************************************/
test {
    useJUnitPlatform()
}

dependencies {
    // Platform
    testAnnotationProcessor enforcedPlatform("io.kestra:platform:$kestraVersion")
    testImplementation enforcedPlatform("io.kestra:platform:$kestraVersion")

    // lombok
    testAnnotationProcessor "org.projectlombok:lombok"
    testCompileOnly 'org.projectlombok:lombok'

    // micronaut
    testAnnotationProcessor "io.micronaut:micronaut-inject-java"
    testAnnotationProcessor "io.micronaut.validation:micronaut-validation-processor"
    testImplementation "io.micronaut.test:micronaut-test-junit5"
    testImplementation "io.micronaut:micronaut-jackson-databind"

    // test deps needed only for to have a runner
    testAnnotationProcessor "io.kestra:processor:$kestraVersion"
    testImplementation "io.kestra:core:$kestraVersion"
    testImplementation "io.kestra:tests:$kestraVersion"
    testImplementation "io.kestra:script:$kestraVersion"
    testImplementation "io.kestra:repository-memory:$kestraVersion"
    testImplementation "io.kestra:runner-memory:$kestraVersion"
    testImplementation "io.kestra:storage-local:$kestraVersion"

    // test
    testImplementation "org.junit.jupiter:junit-jupiter-engine"
    testImplementation "org.hamcrest:hamcrest"
    testImplementation "org.hamcrest:hamcrest-library"
}

/**********************************************************************************************************************\
 * Allure Reports
 **********************************************************************************************************************/
dependencies {
    testImplementation enforcedPlatform("io.kestra:platform:$kestraVersion")
    testImplementation "io.qameta.allure:allure-junit5"
}

/**********************************************************************************************************************\
 * Jacoco
 **********************************************************************************************************************/
test {
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    classDirectories.setFrom(sourceSets.main.output.classesDirs)
    reports {
        xml.required.set(true)
    }
}

/**********************************************************************************************************************\
 * Publish
 **********************************************************************************************************************/
mavenPublishing {
    publishToMavenCentral(true)
    signAllPublications()
    coordinates("${project.group}", "${project.name}", "${project.version}")
    pom {
        name = "${project.name}"
        description = "${project.group}:${project.name}:${project.version}"
        url = "https://github.com/manojbaishya/kestra-plugin-task-java"
        licenses {
            license {
                name = 'The Apache License, Version 2.0'
                url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
            }
        }
        developers {
            developer {
                id = 'tchiotludo'
                name = 'Dehon'
                email = 'ldehon@kestra.io'
            }
        }
        scm {
            connection = 'scm:git:'
            url = "https://github.com/manojbaishya/kestra-plugin-task-java"
        }
    }
}

tasks.withType(GenerateModuleMetadata).configureEach {
    // Suppression this validation error as we want to enforce the Kestra platform
    suppressedValidationErrors.add('enforced-platform')
}

jar {
    exclude "io/kestra/plugin/java/bridge/**"
    manifest {
        attributes(
            "X-Kestra-Name": project.name,
            "X-Kestra-Title": "Java",
            "X-Kestra-Group": project.group + ".java",
            "X-Kestra-Description": project.description,
            "X-Kestra-Version": project.version
        )
    }
}

shadowJar {
    archiveClassifier.set(null)
    exclude "io/kestra/plugin/java/bridge/**"
    mergeServiceFiles()
}

/**********************************************************************************************************************\
 * Version
 **********************************************************************************************************************/
release {
    preCommitText = 'chore(version):'
    preTagCommitMessage = 'update to version'
    tagCommitMessage = 'tag version'
    newVersionCommitMessage = 'update snapshot version'
    tagTemplate = 'v${version}'
    buildTasks = ['classes']
    git {
        requireBranch.set('main')
    }
}

/**********************************************************************************************************************\
 * Dev
 **********************************************************************************************************************/
idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}
